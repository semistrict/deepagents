[package]
name = "durable-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync", "rt"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

# JavaScript hosts: the kernel runs on the host's event loop.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures = "0.4.79"
