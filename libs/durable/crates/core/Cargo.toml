[package]
name = "durable-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync", "rt"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
