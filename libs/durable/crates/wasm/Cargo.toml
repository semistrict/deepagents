[package]
name = "durable-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The durable kernel for JavaScript hosts: Node and Cloudflare Durable Objects."
repository = "https://github.com/semistrict/deepagents"

[lib]
crate-type = ["cdylib"]

# The bindings exist only for JavaScript hosts; natively the crate is empty.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
durable-core = { version = "0.1.0", path = "../core" }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlite-wasm-rs = "0.5.5"
tokio = { version = "1.53.2", default-features = false, features = ["sync"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
