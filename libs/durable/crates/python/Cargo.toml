[package]
name = "durable-python"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
durable-core = { version = "0.1.0", path = "../core" }
pyo3 = { version = "0.29.3", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }

[lib]
name = "_core"
crate-type = ["cdylib"]
